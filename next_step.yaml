schema: cuda-nn.next-step/0.3
status: parked-awaiting-consumer-evidence
updated: 2026-09-06

current:
  issue: null
  title: No active production work
  evidence_consumer: iteathen/UCI-Arena-Vector#3
  outcome: >-
    The first real consumer gate is complete. Direct product-to-CUDA-JS-Tensor
    composition is sufficient for the frozen LatticeKnight model and no reusable
    NN semantic layer has been demonstrated. Production CUDA-NN inference remains
    deferred; dependent inference/training/provider/optimization issues are dormant.

integrated_baseline:
  - Accepted SPEC-0001 owns the independent reusable NN semantic repository boundary and JS/TS-only implementation rule.
  - >-
    ADR-0002 permits future accepted NN profiles to consume reusable RNG semantics
    from iteathen/cuda-rng and communication semantics from iteathen/cuda-comm
    without absorbing either owner.
  - >-
    Issue #2 completed the first-consumer justification gate with direct Tensor
    composition selected for the demonstrated model; issue #17 completed repository
    control-plane alignment and protected-main readback.
  - >-
    Exact live protected repository identity is read from GitHub when needed and is
    not duplicated in this durable next-step file.

constraints:
  - No production NN source or public API is authorized from the current evidence.
  - Closed dormant roadmap/feature issues are retained research, not implementation authority.
  - Generic Tensor semantics remain owned by iteathen/CUDA-JS-Tensor.
  - Generic RNG generator/distribution/reproducibility semantics remain owned by iteathen/cuda-rng.
  - Generic communication group/collective/PGAS/RMA semantics remain owned by iteathen/cuda-comm.
  - All native CUDA/runtime/compiler/provider/resource mechanisms remain owned by iteathen/CUDA-JS.
  - Maintained CUDA-NN source/reference code is JavaScript/TypeScript plus restricted Device-JS only.
  - No Python, C/C++, CUDA C++, hand PTX, direct FFI/Driver access or private lower-layer imports in maintained CUDA-NN paths.
  - Training, autodiff, provider breadth and distributed training require independent reactivation evidence and are not implied by repository existence.

reactivation:
  require: >-
    A materially different consumer or repeated cross-product semantics must
    demonstrate reusable NN meaning beyond direct Tensor composition.
  tests:
    - The proposed concept is not generic Tensor mathematics or planning.
    - The proposed concept is not a native CUDA/provider mechanism.
    - The proposed concept is not product-specific model/checkpoint/head meaning.
    - The abstraction survives first-consumer deletion and materially improves ownership, reuse, or testability.
  action: >-
    Reopen the inference justification gate or create a bounded successor, then
    accept only the smallest consumer-backed semantic specification before source/API work.

sequence:
  - No implementation action while parked.
  - Preserve the repository as the reserved semantic owner without speculative production surface.
  - Reassess only when the reactivation criteria are met by concrete consumer evidence.

blocked_implementation:
  reason: >-
    The demonstrated first real consumer does not require a reusable NN layer above
    CUDA-JS-Tensor. Repository ownership is reserved for future evidence, not active
    production implementation.
