schema: cuda-nn.next-step/0.3
status: inference-gated
updated: 2026-09-05

current:
  issue: 2
  title: Consumer-backed inference-layer justification
  evidence_consumer: iteathen/UCI-Arena-Vector#3
  outcome: >-
    Compare direct product-to-CUDA-JS-Tensor composition with a reusable CUDA-NN
    inference layer using the concrete protected LatticeKnight model mapping. Retain
    only independently useful NN semantics. A conclusion that direct Tensor composition
    is currently sufficient is valid and leaves production CUDA-NN inference deferred.

integrated_baseline:
  - ADR-0001 owns the independent reusable NN semantic repository boundary.
  - >-
    ADR-0002 is integrated: optional accepted NN profiles may consume reusable RNG
    semantics from iteathen/cuda-rng and reusable communication semantics from
    iteathen/cuda-comm without absorbing either semantic owner.
  - >-
    main@ac97fee981b7789e11af2ec4a7ca40799eb08ddd is the current recorded governance
    provenance before this documentation reconciliation; exact live identity is read
    from GitHub when needed.

constraints:
  - No production NN source or public API before issue #2 resolves the consumer-backed inference-layer justification gate.
  - Open roadmap issues are not specifications or implementation authority.
  - Generic Tensor semantics remain owned by iteathen/CUDA-JS-Tensor.
  - Generic RNG generator/distribution/reproducibility semantics remain owned by iteathen/cuda-rng.
  - Generic communication group/collective/PGAS/RMA semantics remain owned by iteathen/cuda-comm.
  - Generic CUDA/runtime/compiler/native-provider/resource mechanisms remain owned by iteathen/CUDA-JS.
  - Training, autodiff, provider breadth and distributed training are not inference prerequisites.
  - Do not claim protected-main or repository-setting parity until issue #17 controls are changed and read back.
  - No Python, C/C++, CUDA C++, hand PTX, direct FFI/Driver access or private lower-layer imports in maintained CUDA-NN production paths.

sequence:
  - >-
    Execute issue #2 against the concrete Vector model evidence: classify every proposed
    reusable concept as CUDA-JS, Tensor, CUDA-NN or product-owned and compare direct
    Tensor composition with the smallest coherent NN layer.
  - >-
    Accept only the smallest consumer-backed NN specifications that survive first-consumer
    deletion and are not generic Tensor/RNG/communication/CUDA semantics.
  - Keep training/provider/distributed lanes independently deferred until their own dependencies and authority are ready.
  - Align CUDA-NN repository settings/protection under issue #17 when a supported settings write path is available.

blocked_implementation:
  reason: >-
    The reusable inference abstraction has not yet been justified against direct
    product-to-Tensor composition. Integrated ownership and optional RNG/COMM composition
    establish semantic boundaries, not production implementation authority.
